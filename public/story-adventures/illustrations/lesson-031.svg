  <title id="title">Why We Have Seasons</title>
  <desc id="desc">Why We Have Seasons. A four-position diagram shows tilted Earth orbiting the Sun with opposite seasons in each hemisphere. Earth’s axis keeps its direction as the planet orbits, changing each hemisphere’s sunlight.</desc>
